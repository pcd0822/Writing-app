[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # googleapis는 Node 18+가 필요하고 22 LTS가 권장. 명시하지 않으면 빌더가
  # 오래된 Node로 떨어져 cold start init이 느려질 수 있음.
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* 환경변수는 Next.js가 빌드 시 클라이언트 번들에 inline한다.
  # Firebase 웹 SDK 키(AIza…로 시작)는 디자인상 공개되어도 안전한 키 —
  # URL 제한 / App Check / Auth·Firestore 보안 규칙으로 보호된다 — 그러나
  # Netlify의 secret scanner는 패턴만 보고 빌드를 차단한다. Firebase 클라이언트
  # 키 6개만 명시적으로 제외해, Gemini API key·Supabase service role·Google
  # service account 같은 진짜 서버 시크릿은 그대로 스캔 보호 대상에 남긴다.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID"
  # Smart Detection은 환경변수와 무관하게 AIza… 같은 알려진 API key 패턴을
  # 빌드 출력에서 직접 검출한다. 위 SECRETS_SCAN_OMIT_KEYS는 키 이름 기반
  # 제외라 패턴 기반 Smart Detection엔 적용되지 않는다. Firebase 웹 키는
  # 공개 안전한 키이므로 Smart Detection을 비활성화한다 — 명시적 secret
  # scanning(서버 환경변수 값이 클라이언트 번들에 새는지 검사)은 그대로 동작.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # googleapis는 패키지가 매우 커서 esbuild로 inline하면 함수 번들이 비대해지고
  # cold start init이 10초를 넘겨 502가 난다. external로 빼면 Netlify가 자동으로
  # 함수 옆에 node_modules를 포함시키고 require()는 콜드 스타트 후 lazy 로드된다.
  external_node_modules = [
    "googleapis",
    "google-auth-library",
    "gaxios",
    "gtoken",
  ]

[[plugins]]
  package = "@netlify/plugin-nextjs"
